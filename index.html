<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealMap - Indian Cooking Guide</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 3rem;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .add-recipe-btn {
            position: absolute;
            right: 2rem;
            top: 2rem;
            padding: 0.6rem 1.2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-recipe-btn:hover {
            background: var(--primary-dark);
        }

        /* Controls */
        .controls {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Recipe Grid */
        .recipe-grid {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
        }

        .card-body h3 {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .tags {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--primary);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .section-title {
            color: var(--primary);
            margin: 1.2rem 0 0.6rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
        }

        .ingredients-list label {
            display: block;
            padding: 0.3rem 0;
            cursor: pointer;
        }

        .steps-list {
            padding-left: 1.2rem;
        }

        .steps-list li {
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.6rem;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
        }

        .form-submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-btn {
            padding: 0.4rem 0.8rem;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .add-recipe-btn {
                position: static;
                margin-top: 1rem;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🗺️ MealMap</h1>
        <p>Your Ultimate Visual Guide & Map to Indian Cooking</p>
        <button class="add-recipe-btn" onclick="openAddModal()">+ Add Custom Recipe</button>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input"
            placeholder="Search dishes by name or ingredients..." />
        <div class="filter-tags">
            <button class="filter-btn active" onclick="filterRecipes('all')">All</button>
            <button class="filter-btn" onclick="filterRecipes('Veg')">Vegetarian (30)</button>
            <button class="filter-btn" onclick="filterRecipes('Non-Veg')">Non-Vegetarian (30)</button>
            <button class="filter-btn" onclick="filterRecipes('North')">North Indian</button>
            <button class="filter-btn" onclick="filterRecipes('South')">South Indian</button>
            <button class="filter-btn" onclick="filterRecipes('East')">East Indian</button>
            <button class="filter-btn" onclick="filterRecipes('West')">West Indian</button>
        </div>
    </div>

    <main class="recipe-grid" id="recipeGrid"></main>

    <!-- Recipe Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('modalOverlay')">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Add Recipe Modal -->
    <div class="modal-overlay" id="addModalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('addModalOverlay')">&times;</button>
            <h2 style="color: var(--primary); margin-bottom: 1rem;">Add Your Own Recipe</h2>
            <form id="addRecipeForm" onsubmit="saveCustomRecipe(event)">
                <div class="form-group">
                    <label>Recipe Title</label>
                    <input type="text" id="customTitle" required placeholder="e.g., Homemade Dal Tadka" />
                </div>
                <div class="form-group">
                    <label>Type / Category</label>
                    <select id="customType">
                        <option value="Veg">Vegetarian</option>
                        <option value="Non-Veg">Non-Vegetarian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Region</label>
                    <select id="customRegion">
                        <option value="North">North Indian</option>
                        <option value="South">South Indian</option>
                        <option value="East">East Indian</option>
                        <option value="West">West Indian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cooking Time</label>
                    <input type="text" id="customTime" required placeholder="e.g., 30 mins" />
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="customImage" required placeholder="https://images.unsplash.com/..." />
                </div>
                <div class="form-group">
                    <label>Ingredients (Separate by line)</label>
                    <textarea id="customIngredients" rows="4" required
                        placeholder="1 cup Rice&#10;2 tbsp Ghee&#10;1 tsp Cumin"></textarea>
                </div>
                <div class="form-group">
                    <label>Instructions (Separate steps by line)</label>
                    <textarea id="customSteps" rows="4" required
                        placeholder="Heat ghee in a pan.&#10;Add cumin seeds.&#10;Mix with rice and cook."></textarea>
                </div>
                <button type="submit" class="form-submit-btn">Save Recipe</button>
            </form>
        </div>
    </div>

        // Initialize LocalStorage if empty
        function getStoredRecipes() {
            const stored = localStorage.getItem('mealmap_recipes');
            if (!stored) {
                localStorage.setItem('mealmap_recipes', JSON.stringify(initialRecipes));
                return initialRecipes;
            }
            return JSON.parse(stored);
        }

        let recipes = getStoredRecipes();
        let currentTimer = null;

        function renderRecipes(items) {
            const grid = document.getElementById('recipeGrid');
            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No recipes found matching your search criteria.</p>`;
                return;
            }
            grid.innerHTML = items.map(recipe => `
        <div class="card" onclick="openRecipe(${recipe.id})">
          <img src="${recipe.image}" alt="${recipe.title}" loading="lazy" />
          <div class="card-body">
            <h3>${recipe.title}</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem;">⏳ ${recipe.time}</p>
            <div class="tags">
              ${recipe.category.map(c => `<span class="badge">${c}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
        }

        function openRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
        <h2>${recipe.title}</h2>
        <img src="${recipe.image}" alt="${recipe.title}" />
        
        <h3 class="section-title">Ingredients</h3>
        <div class="ingredients-list">
          ${recipe.ingredients.map(i => `<label><input type="checkbox"> ${i}</label>`).join('')}
        </div>

        <h3 class="section-title">Step-by-Step Instructions</h3>
        <ol class="steps-list">
          ${recipe.steps.map(s => `<li>${s}</li>`).join('')}
        </ol>

        <div class="timer-box">
          <div>
            <strong>Kitchen Cooking Timer</strong>
            <div id="timerDisplay" style="font-size: 1.2rem; font-family: monospace;">05:00</div>
          </div>
          <button class="timer-btn" onclick="toggleTimer()">Start 5m Timer</button>
        </div>
      `;

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            if (currentTimer) clearInterval(currentTimer);
        }

        function openAddModal() {
            document.getElementById('addModalOverlay').style.display = 'flex';
        }

        function saveCustomRecipe(event) {
            event.preventDefault();

            const title = document.getElementById('customTitle').value;
            const type = document.getElementById('customType').value;
            const region = document.getElementById('customRegion').value;
            const time = document.getElementById('customTime').value;
            const image = document.getElementById('customImage').value;
            const ingredients = document.getElementById('customIngredients').value.split('\n').filter(i => i.trim() !== '');
            const steps = document.getElementById('customSteps').value.split('\n').filter(s => s.trim() !== '');

            const newRecipe = {
                id: Date.now(),
                title,
                category: [region, type],
                time,
                image,
                ingredients,
                steps
            };

            recipes.unshift(newRecipe);
            localStorage.setItem('mealmap_recipes', JSON.stringify(recipes));

            renderRecipes(recipes);
            closeModal('addModalOverlay');
            document.getElementById('addRecipeForm').reset();
            alert('Your recipe has been saved successfully!');
        }

        function filterRecipes(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderRecipes(recipes);
            } else {
                const filtered = recipes.filter(r => r.category.includes(category));
                renderRecipes(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = recipes.filter(r =>
                r.title.toLowerCase().includes(query) ||
                r.ingredients.some(i => i.toLowerCase().includes(query))
            );
            renderRecipes(filtered);
        });

        function toggleTimer() {
            let seconds = 300;
            const display = document.getElementById('timerDisplay');
            if (currentTimer) clearInterval(currentTimer);

            currentTimer = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (seconds <= 0) {
                    clearInterval(currentTimer);
                    alert('Timer finished!');
                }
                seconds--;
            }, 1000);
        }

        // Initial load
        renderRecipes(recipes);
    </script>
